name: Verify guide layout and installed recordings
on:
  push:
    branches: [main]
    paths:
      - 'learning-project-*.js'
      - 'guide-audio-coordinator.js'
      - 'learning-media/**'
      - 'tests/avatar-layout-browser.cjs'
      - 'tests/verify-recordings.py'
      - '.github/workflows/avatar-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avatar-layout
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned recording decoder
        run: |
          python3 -m pip install --only-binary=:all: --no-deps av==15.1.0
      - name: Install pinned browser test tools
        run: |
          npm install --prefix _checks --ignore-scripts --no-audit --no-fund playwright@1.56.1
          google-chrome --version
      - name: Decode every installed recording
        run: python3 tests/verify-recordings.py
      - name: Measure playing, paused and stopped controls on every guide page
        run: node tests/avatar-layout-browser.cjs
