[hidden]{display:none!important}
.rating-row{display:block;min-inline-size:0;padding:18px 0;margin:0;border:0;border-bottom:1px solid #e0e7da}
.rating-row legend{display:block;width:100%;padding:0;margin:0 0 6px;float:none}

.rating-question{display:block;font-size:13px;color:var(--muted);font-weight:400;line-height:1.5;margin-top:4px}
.score-scale{font-size:12px;font-weight:600;color:var(--ink);background:var(--sage);border-radius:6px;padding:8px 10px;margin:7px 0 10px}
.score-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rating-row .score-option{display:flex;align-items:center;justify-content:center;gap:6px;position:relative;min-width:0;min-height:40px;padding:7px 5px;border:1px solid var(--line);border-radius:8px;background:#edf1e5;font-size:16px;font-weight:600;cursor:pointer}
.score-option input{position:static;opacity:1;width:17px;height:17px;margin:0;accent-color:var(--forest);flex-shrink:0}
.score-chip{display:inline;color:var(--ink);cursor:pointer;line-height:1.3}
.score-option input:checked+.score-chip{color:var(--forest);font-weight:700}
.score-option:focus-within{outline:3px solid var(--gold);outline-offset:3px}
.score-option:hover{border-color:var(--forest)}
.rating-row .score-na{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:400;color:var(--muted);margin-top:10px;cursor:pointer}
.score-na input{accent-color:var(--forest);width:16px;height:16px;margin:0}
.task-navigation-note{font-weight:600}

</style><style id="usability-project-header-match">.topbar .brand .mark{width:42px;height:42px;background:transparent;color:var(--forest);border:1.5px solid var(--line);border-radius:50%;font:italic 34px/1 Georgia,serif}.topbar .brand #brandLabel{font-size:18px;line-height:1.2;font-weight:700;max-width:none}@media(max-width:500px){.topbar .brand #brandLabel{font-size:16px}.topbar .brand .mark{width:36px;height:36px;font-size:30px}}</style></head><body><a class="sr-only" href="#main">Skip to the tester</a><header class="topbar" id="testerTopbar"><div class="tester-return-row"><button id="topProjectLink" type="button" class="quiet small">Return to the learning project</button></div><div class="brand"><span class="mark" aria-hidden="true">j</span><span id="brandLabel">Jonathan Pincher</span></div><button type="button" id="testerIntroButton" data-action="intro" class="quiet small" hidden></button><label><span class="sr-only">Language / Idioma / 语言</span><select id="language" aria-label="Language / Idioma / 语言"><option value="en">English</option><option value="es">Español</option><option value="zh">中文</option></select></label></header><div class="shell" id="shell"><aside class="draft-strip"><strong id="draftLabel">First draft · browser-only preview</strong><span id="draftText">Shared collection is not connected yet.</span></aside><main id="main" tabindex="-1"></main><footer class="footer"><span id="footerLabel">Learning by design · Jonathan Pincher</span><button id="projectLink" type="button" class="quiet small">Return to the learning project</button></footer></div><noscript><p style="padding:24px">This tester needs JavaScript. Please enable it and reload.</p></noscript><script>(function usabilityApp(DATA,TEXT,CODE_HASH){
'use strict';
const STAGES=DATA.stages,METRICS=DATA.metrics,DEMOGRAPHICS=DATA.demographics,ROOT='https://jpincher.github.io/My-GitHub-account-is-created/',KEY='jp-usability-draft-session-v2';

function isScore(v){return typeof v==='number'&&Number.isInteger(v)&&v>=1&&v<=5}
function mean(values){const a=values.filter(isScore);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function stageMean(record,id){return mean(METRICS.map(m=>record.sections[id]?.ratings[m.id]??null))}
function overall(record){const a=STAGES.map(s=>stageMean(record,s.id)).filter(v=>v!==null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function aggregate(records){return STAGES.map(s=>{const a=records.map(r=>stageMean(r,s.id)).filter(v=>v!==null);return {id:s.id,n:a.length,average:a.length?a.reduce((x,y)=>x+y,0)/a.length:null,metrics:METRICS.map(m=>({id:m.id,n:records.filter(r=>isScore(r.sections[s.id]?.ratings[m.id])).length,average:mean(records.map(r=>r.sections[s.id]?.ratings[m.id]??null))}))}})}
function cleanRecord(r){
 if(!r||r.schema!=='jp-usability-draft-v2'||typeof r.id!=='string'||r.id.length>100||!r.profile||!r.sections)throw Error('Invalid feedback');
 const text=(v,n)=>typeof v==='string'?v.slice(0,n):'';
 const result={schema:r.schema,id:r.id,created:text(r.created,40),projectVersion:text(r.projectVersion,80),profile:{nickname:text(r.profile.nickname,80),email:text(r.profile.email,254),followup:r.profile.followup===true},sections:{},comments:{},consent:true};
 for(const d of DEMOGRAPHICS){const v=r.profile[d.id];result.profile[d.id]=Number.isInteger(v)&&v>=0&&v<5?v:0}
 for(const stage of STAGES){const s=r.sections[stage.id];if(!s||!Number.isInteger(s.outcome)||s.outcome<0||s.outcome>3)throw Error('Invalid task result');const ratings={};for(const m of METRICS){const v=s.ratings?.[m.id];if(v!==null&&!isScore(v))throw Error('Invalid rating');ratings[m.id]=v}result.sections[stage.id]={outcome:s.outcome,ratings,comment:text(s.comment,2000)}}
 for(const k of ['worked','improve','barriers','anything'])result.comments[k]=text(r.comments?.[k],3000);
 return result;
}

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const newDraft=()=>({schema:'jp-usability-draft-v2',id:uid(),created:new Date().toISOString(),projectVersion:'f4fdbe2',consent:false,profile:{nickname:'',email:'',followup:false,...Object.fromEntries(DEMOGRAPHICS.map(d=>[d.id,0]))},sections:Object.fromEntries(STAGES.map(s=>[s.id,{outcome:null,ratings:Object.fromEntries(METRICS.map(m=>[m.id,null])),answered:{},comment:''}])),comments:{worked:'',improve:'',barriers:'',anything:''}});
let state={lang:'en',screen:'form',index:0,unlocked:0,draft:newDraft(),records:[],admin:false,error:'',notice:'',filters:{search:'',sort:'new',min:'',max:''}},projectRef=null,storageFailed=false,lastRecord=null;
try{const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved){state={...state,...saved,admin:false,error:'',notice:'',records:(saved.records||[]).map(cleanRecord)};if(!saved.draft?.sections)state.draft=newDraft()}}catch{}
const queryLang=new URLSearchParams(location.search).get('lang');if(['en','es','zh'].includes(queryLang))state.lang=queryLang;
if(!['en','es','zh'].includes(state.lang))state.lang='en';
if(!['form','review','report'].includes(state.screen))state.screen='report';
if(location.hash==='#report')state.screen='report';
const tr=k=>TEXT[state.lang][k]??TEXT.en[k]??k;
const stageText=s=>s[state.lang]||s.en;
const metricText=m=>m[state.lang]||m.en;
function save(){try{const {admin,error,notice,...safe}=state;sessionStorage.setItem(KEY,JSON.stringify(safe))}catch{storageFailed=true}}
function fmt(v){return v===null?tr('unscored'):v.toFixed(1)}
function btn(action,label,cls='',extra=''){return '<button type="button" data-action="'+action+'" class="'+cls+'" '+extra+'>'+esc(label)+'</button>'}
function errorBlock(){return state.error?'<div class="error" role="alert">'+esc(state.error)+'</div>':''}
function actionRow(back,next,label){return '<div class="actions">'+btn(back,tr('back'),'quiet')+btn(next,label||tr('next'),'primary')+'</div>'}
function progress(){
 const items=[tr('profileShort'),...STAGES.map((s,i)=>String(i+1)),tr('commentsShort')];
 return '<nav aria-label="'+esc(tr('progress'))+'"><ol class="progress">'+items.map((label,i)=>'<li>'+ (i<=state.unlocked?'<button type="button" data-action="goto" data-index="'+i+'" class="'+(i<state.index?'visited':'')+'" '+(i===state.index?'aria-current="step"':'')+'><b>'+(i===0?'○':i===6?'✓':i)+'</b><span>'+esc(i>0&&i<6?stageText(STAGES[i-1])[0]:label)+'</span></button>':'<span class="progress-future"><b>'+(i===6?'✓':i)+'</b><span>'+esc(i>0&&i<6?stageText(STAGES[i-1])[0]:label)+'</span></span>')+'</li>').join('')+'</ol></nav>';
}
function profile(){
 const p=state.draft.profile;
 return '<section class="hero"><p class="kicker">'+esc(tr('summaryCount'))+'</p><h1>'+esc(tr('title'))+'</h1><p class="tester-example-note">'+esc(tr('exampleNote'))+'</p><p class="lede">'+esc(tr('intro'))+'</p></section><section class="panel"><h2>'+esc(tr('profile'))+'</h2><p class="hint">'+esc(tr('privacy'))+'</p><div class="profile-grid">'+
 '<label class="field"><span>'+esc(tr('nickname'))+' <small>'+esc(tr('optional'))+'</small></span><input name="profile.nickname" maxlength="80" autocomplete="off" value="'+esc(p.nickname)+'"></label>'+
 '<label class="field"><span>'+esc(tr('email'))+' <small>'+esc(tr('optional'))+'</small></span><input name="profile.email" type="email" maxlength="254" autocomplete="off" value="'+esc(p.email)+'"><small>'+esc(tr('emailNote'))+'</small></label>'+
 DEMOGRAPHICS.map(d=>'<label class="field"><span>'+esc(d[state.lang][0])+' <small>'+esc(tr('optional'))+'</small></span><select name="profile.'+d.id+'">'+d[state.lang][1].map((o,i)=>'<option value="'+i+'" '+(p[d.id]===i?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>').join('')+
 '</div><label class="check"><input name="profile.followup" type="checkbox" '+(p.followup?'checked':'')+'><span>'+esc(tr('followup'))+'</span></label><label class="check"><input name="consent" type="checkbox" '+(state.draft.consent?'checked':'')+'><span>'+esc(tr('consent'))+'</span></label>'+errorBlock()+'<div class="actions">'+btn('report',tr('report'),'quiet')+btn('start',tr('start'),'primary')+'</div></section>';
}
function stagePage(i){
 const s=STAGES[i],r=state.draft.sections[s.id],text=stageText(s),outcomes=tr('outcomes');
 return '<header class="hero"><p class="kicker">'+esc(tr('step'))+' '+(i+1)+' '+esc(tr('of'))+' 5</p><h1>'+esc(text[0])+'</h1></header><section class="panel soft task"><h2>'+esc(tr('task'))+'</h2><p>'+esc(text[1])+'</p><p>'+esc(text[2])+'</p><p class="task-navigation-note">'+esc(tr('taskButtons'))+'</p><div class="task-links">'+s.routes.map(route=>btn('view',DATA.routeNames[route][state.lang],'','data-route="'+route+'"')).join('')+'</div><span class="hint">'+esc(tr('projectHint'))+'</span><p id="projectStatus" class="status" role="status"></p><button type="button" id="projectFallback" data-action="project" class="small quiet" hidden>'+esc(tr('openProject'))+'</button></section>'+
 '<section class="panel"><h3>'+esc(tr('taskOutcome'))+'</h3><div class="outcomes" role="group" aria-label="'+esc(tr('taskOutcome'))+'">'+outcomes.map((label,n)=>btn('outcome',label,'','data-value="'+n+'" aria-pressed="'+(r.outcome===n)+'"')).join('')+'</div></section>'+
 '<section class="panel"><h2>'+esc(tr('rate'))+'</h2>'+METRICS.map(m=>{

async function handle(action,el){

 if(action==='download'){download([state.screen==='review'?makeRecord():lastRecord||makeRecord()]);return}
 if(action==='report'){state.screen='report';state.admin=false;state.notice='';history.replaceState(null,'','#report');render();return}
 if(action==='another'){state.draft=newDraft();state.screen='form';state.index=0;state.unlocked=0;state.notice='';state.admin=false;history.replaceState(null,'',location.pathname+location.search);render();return}

 if(action==='login'){try{const value=$('developerCode').value;const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));const hash=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');if(hash===CODE_HASH){state.admin=true;state.screen='developer';state.notice=''}else state.error=tr('wrongCode')}catch{state.error=tr('wrongCode')}render();return}
