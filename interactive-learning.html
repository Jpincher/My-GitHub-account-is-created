<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning by design | Jonathan Pincher</title><meta name="description" content="Jonathan Pincher’s interactive learning-design portfolio: school and undergraduate activities, teaching materials, ADDIE and reflection."><style>body{margin:0;background:#faf8ee;color:#284b37;font:17px/1.6 Arial,sans-serif}main{max-width:650px;margin:15vh auto;padding:28px}h1{font:40px Georgia,serif}button,a{color:inherit}button{padding:10px 18px;border:1px solid #bdcbb5;border-radius:8px;background:#edf1e5;font:inherit}</style></head><body><main><h1>Learning by design.</h1><p id="loadStatus" role="status">Opening the full interactive project…</p><noscript>This interactive project requires JavaScript. Please enable JavaScript to use its activities and navigation.</noscript><button id="retry" hidden>Try again</button><p><a href="index.html">Back to the portfolio</a></p></main><script>(()=>{'use strict';const parts=["learning-project-05c34d493c64-1of3.txt", "learning-project-05c34d493c64-2of3.txt", "learning-project-05c34d493c64-3of3.txt"];async function open(){try{const texts=await Promise.all(parts.map(async path=>{const r=await fetch(new URL(path,location.href));if(!r.ok)throw Error('Unable to load project');return r.text()}));const html=texts.join('');if(!html.includes('const pages=')||!html.endsWith('</html>'))throw Error('Incomplete project');document.open();document.write(html);document.close()}catch(e){document.getElementById('loadStatus').textContent='The project could not finish loading. Check your connection and try again.';document.getElementById('retry').hidden=false;}}document.getElementById('retry').onclick=()=>location.reload();open();})();</script></body></html>
